name: Build cases list

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild the cases list
        run: python3 tools/build_cases.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild cases list"
            git push
          else
            echo "Nothing to commit."
          fi
