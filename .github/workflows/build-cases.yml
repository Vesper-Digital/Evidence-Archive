name: Build cases list

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-cases
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: File loose uploads
        run: python3 tools/sort_files.py

      - name: Refresh the video list
        run: python3 tools/fetch_videos.py

      - name: Read the DSX tables and gallery
        run: |
          pip install --quiet openpyxl pymupdf
          python3 tools/build_tables.py

      - name: Rebuild the cases list
        run: python3 tools/build_cases.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sort inbox and rebuild cases"
            git pull --rebase origin main
            git push
          else
            echo "Nothing to commit."
          fi

      - name: Gather the site
        run: |
          mkdir -p _site
          tar -cf - --exclude=./.git --exclude=./.github \
                    --exclude=./tools --exclude=./_site . \
            | (cd _site && tar -xf -)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
