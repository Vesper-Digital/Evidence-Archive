function creative(i){
 switch(i){
 case 0:return {mode:'intro',v:panel(`${unBadge()}<div class="visual-eyebrow">The original wording</div><div class="visual-big">SHALL</div><div class="visual-detail">Countries MUST prohibit certain weapons</div><div class="visual-rule"></div><div class="visual-eyebrow">Canada proposed</div><div class="visual-big red">MAY</div><div class="visual-detail">The prohibition becomes optional</div>`)};
 case 1:return {mode:'logos',v:`<div class="logo-card">${img(media.kraken,'Genuine Kraken Robotics logo cropped from the cited press presentation')}</div><div class="logo-card">${img(media.sefine,'Genuine SEFINE Shipyard emblem cropped from the cited press presentation')}</div>`};
 case 2:return {mode:'portrait',v:img(media.july,'Carney and Erdoğan in July 2026, original documentary photo')+'<div class="credit">Türkiye Today · July 2026</div>'};
 case 3:return {mode:'graphic',v:panel(`<div class="visual-eyebrow">CANADA · NATIONAL DEFENCE</div><div class="visual-big red med">DEFENCE DRONE INITIATIVE</div><div class="visual-rule"></div><div class="visual-detail">Armed drones</div><div class="visual-rule"></div><div class="visual-detail">Counter-drone systems</div><div class="visual-rule"></div><div class="visual-detail">Precision-strike technology</div>`)};
 case 4:return {mode:'un-photo',v:img(media.un,'Actual footage from the United Nations September 2 meeting')+'<div class="un-tag">🇺🇳 UNITED NATIONS · TÜRKİYE</div><div class="credit">UN footage · Sept 2</div>'};
 case 5:return {mode:'graphic',v:panel(`${unBadge()}<div class="visual-eyebrow">Canada's proposed wording</div><div class="visual-big" style="text-decoration:line-through;text-decoration-color:var(--red)">SHALL</div><div class="visual-big red">MAY</div><div class="visual-big med">or SHOULD</div><div class="visual-detail">Mandatory → optional</div>`)};
 case 6:return {mode:'graphic',v:panel(`${unBadge()}<div class="visual-eyebrow">September 3, 2026</div><div class="visual-big med">PARA 34</div><div class="visual-rule"></div><div class="visual-big red">REMOVED</div><div class="visual-detail">The chair deletes the disputed paragraph from the negotiating draft.</div>`)};
 case 7:return {mode:'graphic',v:panel(`<div class="visual-eyebrow">DRONE PRODUCTION PARTNERSHIP</div><div class="visual-big med">🇨🇦 CANADA</div><div class="visual-big red med">+</div><div class="visual-big med">🇺🇦 UKRAINE</div><div class="visual-rule"></div><div class="visual-detail">Joint manufacturing and supply of military drones</div>`)};
 case 8:return {mode:'oct-photo',v:`<img class="oct-img" src="${newMedia.oct}" alt="Carney and Erdoğan shake hands in Ankara during October 22, 2026 official visit" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="oct-fallback" style="display:none">OCTOBER 22, 2026<br>ANKARA · SECOND MEETING<br><small>Real photo from TRT Haber requires internet</small></div><div class="credit">TRT Haber · October 22, 2026</div>`};
 case 9:return {mode:'quote',v:`<div class="quote-board"><div class="small-label">CARNEY'S OWN WORDS · OCTOBER 22</div><div class="quote" style="margin-top:15px">“export opportunities abroad”</div><div class="credit-quote">From Carney's remarks alongside President Erdoğan</div></div>`};
 case 10:return {mode:'deal-photos',v:`<div class="deal-photo"><img src="${newMedia.sign}" alt="Photo of CIEL and ASELSAN representatives at partnership announcement"></div><div class="deal-logos"><div><img src="${newMedia.ciel}" alt="Official CIEL Defence logo"></div><div><img src="${newMedia.aselsan}" alt="Official ASELSAN logo"></div></div><div class="credit">Signing photo · True North Strategic Review</div>`};
 case 11:return {mode:'budget',v:panel(`<div class="visual-eyebrow">BUDGET 2026 · NOVEMBER 5</div><div class="budget-number">C$2.3B</div><div class="visual-detail">Proposed over five years<br>Starting 2027–28</div><div class="visual-rule"></div><div class="visual-detail">Drones · Counter-drone systems<br>Acquisition and deployment</div>`) };
 case 12:return {mode:'closer',v:panel(`${unBadge()}<div class="visual-eyebrow">The sequence</div><div class="visual-big med">PARTNERSHIPS</div><div class="visual-big red med">→ UN DEBATE</div><div class="visual-big med">→ EXPORTS</div><div class="visual-rule"></div><div class="visual-detail">Budget 2026: C$2.3 billion proposed for drone capabilities.</div>`)};
 }
}
const stage=document.querySelector('#stage');const dots=document.querySelector('#dots');
let current=0;
events.forEach((e,i)=>{
 const c=creative(i),a=document.createElement('article');a.className='event layout-'+c.mode;
 a.innerHTML=`<div class="hero"><div class="copy"><div class="date"></div><h2 class="event-title"></h2><p class="desc"></p></div><div class="visual">${c.v}</div></div><div class="source-area"><a class="source" href="" target="_blank" rel="noopener noreferrer"><span class="source-label"></span><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M7 17L17 7M8 7h9v9"/></svg></a></div>`;
 if(c.mode==='quote'){a.querySelector('.hero').insertBefore(a.querySelector('.visual'),a.querySelector('.copy'));}
 a.querySelector('.date').textContent=e.date;a.querySelector('h2').textContent=e.title;a.querySelector('.desc').textContent=e.body;
 a.querySelector('.source').href=e.url;a.querySelector('.source-label').textContent=e.label;
 a.querySelector('.source').addEventListener('click',ev=>ev.stopPropagation());
 stage.appendChild(a);let dot=document.createElement('span');dot.className='dot';dots.append(dot);
});
const slides=[...stage.children],ds=[...dots.children];
function show(i){if(i<0||i>=slides.length)return;current=i;
 slides.forEach((s,j)=>{s.classList.toggle('active',j===i);s.classList.toggle('before',j<i);s.setAttribute('aria-hidden',j!==i)});
 ds.forEach((d,j)=>d.classList.toggle('on',j===i));document.querySelector('#counter').textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
 document.querySelector('#bar').style.width=(100*(i+1)/slides.length)+'%';document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===slides.length-1;
}
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);
stage.addEventListener('click',ev=>{if(!ev.target.closest('a'))show(current+1)});
document.addEventListener('keydown',ev=>{if(['ArrowRight','PageDown',' '].includes(ev.key)){ev.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(ev.key)){ev.preventDefault();show(current-1)}if(ev.key==='Home')show(0);if(ev.key==='End')show(events.length-1)});
show(0);
</script></body></html>
